<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Read interesting articles and join the conversation."
    />
    <title>Odin Journal | Home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <a class="logo" href="index.html">Odin Journal.</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="#account">Account</a>
      </nav>
    </header>

    <main class="container">
      <section class="hero">
        <p class="eyebrow">THE ODIN BLOG</p>
        <h1>Ideas worth<br />reading.</h1>
        <p>
          Discover articles, share perspectives and join meaningful
          conversations.
        </p>
      </section>

      <section class="articles">
        <div class="section-heading">
          <div>
            <p class="eyebrow">EXPLORE</p>
            <h2>Latest articles</h2>
          </div>
        </div>
        <div id="posts" class="posts-grid">
          <p>Loading articles...</p>
        </div>
      </section>

      <section id="account" class="account-section">
        <p class="eyebrow">JOIN THE COMMUNITY</p>
        <h2>Your account</h2>

        <div id="auth-status"></div>

        <div class="auth-grid">
          <form id="login-form" class="auth-card">
            <h3>Log in</h3>
            <input name="identifier" placeholder="Email or username" required />
            <input
              name="password"
              type="password"
              placeholder="Password"
              required
            />
            <button type="submit">Log in</button>
          </form>

          <form id="register-form" class="auth-card">
            <h3>Create account</h3>
            <input name="username" placeholder="Username" required />
            <input name="email" type="email" placeholder="Email" required />
            <input
              name="password"
              type="password"
              minlength="8"
              placeholder="Password (8+ characters)"
              required
            />
            <button type="submit">Sign up</button>
          </form>
        </div>
        <button id="logout-button" class="secondary hidden">Log out</button>
      </section>
    </main>

    <footer>
      <p>© 2026 Odin Journal. Built with Node.js and Express.</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
